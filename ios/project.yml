name: LidSleepToggle
options:
  bundleIdPrefix: com.sufwan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # set your team in Xcode before installing on device
    CODE_SIGN_STYLE: Automatic

targets:
  # ---- iOS app ----
  LidSleepToggle:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sufwan.lidsleeptoggle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/LidSleepToggle.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lid Sleep
        NSCameraUsageDescription: Scan the pairing QR code shown on your Mac to connect it.
        CFBundleURLTypes:
          - CFBundleURLName: com.sufwan.lidsleeptoggle
            CFBundleURLSchemes: [lidsleep]
        UIBackgroundModes: []
    dependencies:
      - target: LidWidgetExtension

  # ---- Widget + Control extension ----
  LidWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sufwan.lidsleeptoggle.widget
        CODE_SIGN_ENTITLEMENTS: Widget/LidWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lid Sleep
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
